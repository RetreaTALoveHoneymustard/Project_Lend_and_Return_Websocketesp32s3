<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PN532 console</title>
<style>
  :root {
    --bg: #14110d;
    --panel: #1c1712;
    --line: #3a3126;
    --text: #e9dfc8;
    --dim: #8f8368;
    --amber: #e8a33d;
    --ok: #7fb56a;
    --err: #c9634a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 14px;
  }
  body { padding: 24px; max-width: 720px; margin: 0 auto; }

  .title { font-size: 15px; color: var(--amber); margin: 0 0 2px; }
  .subtitle { color: var(--dim); margin: 0 0 20px; font-size: 12px; }

  fieldset {
    border: 1px solid var(--line);
    padding: 14px;
    margin: 0 0 16px;
  }
  legend { color: var(--dim); padding: 0 6px; font-size: 12px; }

  label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 4px; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 8px;
    font: inherit;
  }
  input:focus { outline: 1px solid var(--amber); }

  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--amber); color: var(--amber); }
  button:disabled { opacity: 0.4; cursor: default; }

  .status-line { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .status-line .on { color: var(--ok); }
  .status-line .off { color: var(--err); }

  .log {
    border: 1px solid var(--line);
    height: 320px;
    overflow-y: auto;
    padding: 10px 12px;
    background: #100d09;
  }
  .entry { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .entry .meta { color: var(--dim); font-size: 11px; }
  .entry .ok { color: var(--ok); }
  .entry .err { color: var(--err); }
  .empty { color: var(--dim); }
</style>
</head>
<body>

  <p class="title">pn532 console</p>
  <p class="subtitle">sends commands over HTTP to the backend, which relays them to the ESP32-S3 over WebSocket</p>

  <fieldset>
    <legend>connection</legend>
    <label for="backendUrl">backend url</label>
    <input id="backendUrl" value="https://your-backend-host.onrender.com" />
    <label for="deviceId">device id</label>
    <input id="deviceId" value="esp32-01" />
    <div class="row">
      <button id="refreshBtn">check devices online</button>
    </div>
    <div class="status-line" id="statusLine">not checked yet</div>
  </fieldset>

  <fieldset>
    <legend>commands</legend>
    <div class="row">
      <button data-cmd="ping">ping</button>
      <button data-cmd="get_firmware_version">get firmware version</button>
      <button data-cmd="read_tag">read tag</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>log</legend>
    <div class="log" id="log"><div class="empty">nothing sent yet</div></div>
  </fieldset>

<script>
  const $ = (id) => document.getElementById(id);
  const logEl = $("log");

  function baseUrl() {
    return $("backendUrl").value.trim().replace(/\/$/, "");
  }

  function logEntry(html) {
    if (logEl.querySelector(".empty")) logEl.innerHTML = "";
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = html;
    logEl.prepend(div);
  }

  function timestamp() {
    return new Date().toLocaleTimeString();
  }

  async function checkDevices() {
    $("statusLine").textContent = "checking…";
    try {
      const res = await fetch(`${baseUrl()}/api/devices`);
      const data = await res.json();
      const list = data.devices || [];
      const wanted = $("deviceId").value.trim();
      const online = list.includes(wanted);
      $("statusLine").innerHTML =
        `online devices: [${list.join(", ") || "none"}] — target "${wanted}" is ` +
        (online ? `<span class="on">online</span>` : `<span class="off">offline</span>`);
    } catch (e) {
      $("statusLine").innerHTML = `<span class="off">could not reach backend: ${e.message}</span>`;
    }
  }

  async function sendCommand(command) {
    const deviceId = $("deviceId").value.trim();
    const startedAt = timestamp();
    try {
      const res = await fetch(`${baseUrl()}/api/command`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deviceId, command }),
      });
      const data = await res.json();
      const cls = res.ok && data.status === "ok" ? "ok" : "err";
      logEntry(
        `<div class="meta">${startedAt} — ${command} → ${deviceId}</div>` +
        `<div class="${cls}">${JSON.stringify(data)}</div>`
      );
    } catch (e) {
      logEntry(
        `<div class="meta">${startedAt} — ${command} → ${deviceId}</div>` +
        `<div class="err">request failed: ${e.message}</div>`
      );
    }
  }

  $("refreshBtn").addEventListener("click", checkDevices);
  document.querySelectorAll("button[data-cmd]").forEach((btn) => {
    btn.addEventListener("click", () => sendCommand(btn.dataset.cmd));
  });
</script>
</body>
</html>
